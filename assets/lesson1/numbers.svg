<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#faf8f2" rx="16"/>
  <text x="360" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#2a3a5c">Numbers 110</text>
  <g font-family="Arial,sans-serif" font-size="22" fill="#1a1a2e">
    <text x="60" y="100">1  one</text><text x="280" y="100">2  two</text><text x="500" y="100">3  three</text>
    <text x="60" y="160">4  four</text><text x="280" y="160">5  five</text><text x="500" y="160">6  six</text>
    <text x="60" y="220">7  seven</text><text x="280" y="220">8  eight</text><text x="500" y="220">9  nine</text>
    <text x="60" y="280">10  ten</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#5b7cfa">
    <text x="80" y="360">1</text><text x="150" y="360">2</text><text x="220" y="360">3</text>
    <text x="290" y="360">4</text><text x="360" y="360">5</text><text x="430" y="360">6</text>
    <text x="500" y="360">7</text><text x="560" y="360">8</text><text x="620" y="360">9</text><text x="670" y="360" font-size="36">10</text>
  </g>
</svg>
